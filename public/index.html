<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Particular</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:wght@400;500;600&family=Parisienne&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64" aria-label="Logo Biblioteca Particular Sistene Rosa">
        <!-- Fundo Circular -->
        <circle cx="50" cy="50" r="48" fill="#FFFFFF" stroke="#B99A5B" stroke-width="1" stroke-dasharray="230 70" stroke-dashoffset="-20" />
        <text x="50" y="92" text-anchor="middle" font-family="&#39;Parisienne&#39;, cursive" font-size="15" fill="#B08A8A">
            Sislene Rosa
        </text>
        <defs>
            <!-- Trajeto curvo para o texto superior -->
            <path id="arcTop" d="M 14 50 A 36 36 0 0 1 86 50" />
        </defs>

        <!-- Texto Curvo Superior -->
        <text font-family="&#39;Cormorant Garamond&#39;, Georgia, serif" font-size="6" font-weight="700" letter-spacing="1.4" fill="#5C4A4A">
            <textPath href="#arcTop" startOffset="50%" text-anchor="middle">BIBLIOTECA PARTICULAR</textPath>
        </text>

        <!-- Flor Central com Folhas -->
        <g transform="translate(50 44)">
            <path d="M-10 12 q -8 -4 -6 -12 q 9 4 6 12" fill="#8A9A8B" />
            <path d="M10 12 q 8 -4 6 -12 q -9 4 -6 12" fill="#8A9A8B" />
            <!-- Pétalas -->
            <g fill="#E3BEBE" stroke="#C98B8B" stroke-width="0.6">
            <ellipse cx="0" cy="-9" rx="4.5" ry="7" />
            <ellipse cx="0" cy="-9" rx="4.5" ry="7" transform="rotate(72)" />
            <ellipse cx="0" cy="-9" rx="4.5" ry="7" transform="rotate(144)" />
            <ellipse cx="0" cy="-9" rx="4.5" ry="7" transform="rotate(216)" />
            <ellipse cx="0" cy="-9" rx="4.5" ry="7" transform="rotate(288)" />
            </g>
            <!-- Centro da Flor -->
            <circle cx="0" cy="0" r="3.6" fill="#C9A227" />
            <!-- Folhas Sálvia -->
        </g>

        <!-- Livro Aberto -->
        <g transform="translate(0, 2)">
            <path d="M30 64 q 10 -4 20 2 q 10 -6 20 -2 v 14 q -10 -4 -20 2 q -10 -6 -20 -2 Z" fill="#F3E9D8" stroke="#8B6F4E" stroke-width="0.9" />
            <path d="M50 66 v 14" stroke="#8B6F4E" stroke-width="1" />
            <!-- Linhas de texto das páginas -->
            <path d="M36 70 q 6 -2 10 0 M36 74 q 6 -2 10 0 M54 70 q 6 -2 10 0 M54 74 q 6 -2 10 0" stroke="#8A9A8B" stroke-width="0.6" fill="none" />
        </g>

        <!-- Assinatura Inferior -->
        </svg>
      <div class="titulo-marca">
        <h1>Biblioteca Particular</h1>
        <p id="subtitulo" class="assinatura">Sislene Rosa</p>
      </div>
    </div>
    <input type="search" id="busca" class="busca-principal"
           placeholder="Buscar por título, autor, editora, localização ou emprestado para..."
           aria-label="Buscar no acervo">
    <button id="abrir-novo" type="button" class="primario">+ Novo livro</button>
  </header>

  <main>
    <section class="cabecalho-pagina">
      <h2>Sua biblioteca, com cuidado de jardim</h2>
      <p>Um catálogo para organizar o que você lê, quer ler e já leu.</p>
    </section>

<div class="divisor-floral" aria-hidden="true">
  <span class="linha-divisor"></span>
  <span class="flor-divisor">
    <!-- SVG ajustado conforme o modelo de referência (folhas superiores e círculo central) -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
      <!-- Raminho / folhas duplas superiores em lineart -->
      <path d="M 12 14 Q 9 9 7 11 Q 6 13 10 14 Z" stroke="#8A9A8B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 12 14 Q 15 9 17 11 Q 18 13 14 14 Z" stroke="#8A9A8B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Círculo central em tom rosa suave -->
      <circle cx="12" cy="17" r="3.2" fill="#E3BEBE" stroke="#C98B8B" stroke-width="1"/>
    </svg>
  </span>
  <span class="linha-divisor"></span>
</div>

    <section id="metricas" class="metricas" aria-label="Resumo do acervo. Clique para filtrar."></section>

    <div id="pills-generos" class="pills" aria-label="Filtrar por gênero"></div>
    <div class="linha-filtros">
      <span id="filtros-ativos">Nenhum filtro ativo</span>
    </div>
    <section class="barra-filtros" aria-label="Filtros">
      <div class="campo">
        <label for="filtro-genero">Gênero</label>
        <select id="filtro-genero"></select>
      </div>
      <div class="campo">
        <label for="filtro-status">Status de leitura</label>
        <select id="filtro-status">
          <option value="">Todos</option>
          <option value="nao_lido">Não lido</option>
          <option value="lendo">Lendo</option>
          <option value="lido">Lido</option>
        </select>
      </div>
      <div class="campo">
        <label for="filtro-avaliacao">Avaliação</label>
        <select id="filtro-avaliacao">
          <option value="">Qualquer</option>
          <option value="sem">Sem avaliação</option>
          <option value="1">1 estrela</option>
          <option value="2">2 estrelas</option>
          <option value="3">3 estrelas</option>
          <option value="4">4 estrelas</option>
          <option value="5">5 estrelas</option>
        </select>
      </div>
      <div class="campo">
        <label for="filtro-faixa">Faixa de páginas</label>
        <select id="filtro-faixa"></select>
      </div>
      <div class="campo">
        <label for="filtro-cadastro">Data de cadastro</label>
        <select id="filtro-cadastro"></select>
      </div>
      <div class="campo">
        <label for="filtro-ordenar">Ordenação</label>
        <select id="filtro-ordenar"></select>
      </div>
      <div>      
        <button id="limpar" type="button" class="link">Limpar filtros</button>
      </div>
    </section>

    <p id="contagem" class="resumo-lista"></p>
    <p id="erro-global" class="erro" hidden></p>

    <section id="lista" class="grade"></section>
    <p id="vazio" class="vazio" hidden>Nenhum livro encontrado com os filtros atuais.</p>

    <div class="mais">
      <button id="carregar-mais" type="button" hidden>Carregar mais</button>
    </div>
  </main>

  <!-- Barra de seleção para exportação -->
  <div id="barra-selecao" class="barra-selecao" hidden>
    <span id="contador-selecao"></span>
    <button id="exportar-abrir" type="button">Exportar .doc</button>
    <button id="limpar-selecao" type="button">Limpar seleção</button>
  </div>

  <!-- Detalhes do livro -->
  <dialog id="detalhe" class="modal" aria-labelledby="detalhe-titulo">
    <div class="modal-conteudo">
      <header class="modal-cab">
        <h2 id="detalhe-titulo"></h2>
        <button type="button" class="fechar" data-fechar="detalhe" aria-label="Fechar">×</button>
      </header>
      <div id="detalhe-corpo"></div>
      <div class="rodape-detalhe">
        <button type="button" class="primario" data-fechar="detalhe">Salvar</button>
      </div>
    </div>
  </dialog>

  <!-- Cadastro e edição -->
  <dialog id="livro" class="modal" aria-labelledby="livro-titulo">
    <div class="modal-conteudo">
      <header class="modal-cab">
        <h2 id="livro-titulo">Novo livro</h2>
        <button type="button" class="fechar" data-fechar="livro" aria-label="Fechar">×</button>
      </header>

      <form id="form-livro" class="formulario">
        <div class="linha">
          <label>
            ISBN
            <input name="isbn" placeholder="10 ou 13 dígitos">
          </label>
          <div class="campo-botao">
            <button type="button" id="buscar-isbn">Buscar dados pelo ISBN</button>
          </div>
        </div>
        <p id="isbn-status" class="ajuda"></p>

        <label>
          Título
          <input name="titulo" required>
        </label>

        <div class="linha">
          <label>
            Autor
            <input name="autor">
          </label>
          <label>
            Editora
            <input name="editora">
          </label>
        </div>

        <div class="linha">
          <label>
            Gênero
            <input name="genero" list="lista-generos">
          </label>
          <label>
            Localização física
            <input name="localizacao" placeholder="Ex.: Estante B, prateleira 3">
          </label>
        </div>
        <datalist id="lista-generos"></datalist>

        <div class="linha">
          <label>
            Ano
            <input name="ano" type="number" min="1000" max="2100">
          </label>
          <label>
            Páginas
            <input name="paginas" type="number" min="1" max="100000">
          </label>
        </div>

        <div class="linha">
          <label>
            Idioma
            <input name="idioma" value="Português">
          </label>
          <label>
            Tags (separadas por vírgula)
            <input name="tags" placeholder="assassinato, encontro">
          </label>
        </div>

        <div class="bloco-emprestimo">
          <label class="caixa">
            <input type="checkbox" name="emprestado">
            <span>Livro emprestado</span>
          </label>
          <label>
            Emprestado para
            <input name="emprestado_para" placeholder="Nome de quem está com o livro">
          </label>
        </div>

        <label>
          URL da capa (opcional)
          <input name="capa_url" type="url" placeholder="https://...">
        </label>

        <label>
          Descrição
          <textarea name="descricao" rows="3"></textarea>
        </label>

        <p id="erro-form" class="erro" hidden></p>

        <div class="acoes-modal">
          <button type="button" data-fechar="livro">Cancelar</button>
          <button type="submit" id="salvar-livro" class="primario">Salvar</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Seleção final para exportação -->
  <dialog id="exportar" class="modal" aria-labelledby="exportar-titulo">
    <div class="modal-conteudo">
      <header class="modal-cab">
        <h2 id="exportar-titulo">Exportar livros</h2>
        <button type="button" class="fechar" data-fechar="exportar" aria-label="Fechar">×</button>
      </header>
      <p class="ajuda">Desmarque os livros que não devem entrar no arquivo.</p>
      <div id="lista-exportar" class="lista-exportar"></div>
      <p id="erro-exportar" class="erro" hidden></p>
      <div class="acoes-modal">
        <button type="button" data-fechar="exportar">Cancelar</button>
        <button type="button" id="exportar-gerar" class="primario">Gerar arquivo .doc</button>
      </div>
    </div>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
