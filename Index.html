<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acervo Técnico – GCR MAQ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <h1>Acervo Técnico GCR MAQ</h1>
    <p>Livros e manuais de equipamentos</p>
  </header>

  <main>
    <section class="filtros" aria-label="Filtros">
      <input type="search" id="busca" placeholder="Buscar por título, equipamento, autor ou tag...">
      <select id="filtro-tipo" aria-label="Filtrar por tipo">
        <option value="">Todos os tipos</option>
      </select>
      <select id="filtro-categoria" aria-label="Filtrar por categoria">
        <option value="">Todas as categorias</option>
      </select>
      <button id="limpar" type="button">Limpar</button>
    </section>

    <p id="contagem" class="contagem"></p>
    <section id="lista" class="grade"></section>
    <p id="vazio" class="vazio" hidden>Nenhum item encontrado com os filtros atuais.</p>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
